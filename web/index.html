<script>
  (function () {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/png';
    document.head.appendChild(link);

    let frame = 0;

    function draw() {
      ctx.clearRect(0, 0, 64, 64);

      const t = frame / 60;

      // Background
      ctx.fillStyle = '#0A0A0A';
      ctx.fillRect(0, 0, 64, 64);

      // Pulsing outer ring
      const pulse = 0.85 + Math.sin(t * Math.PI * 2) * 0.08;
      ctx.beginPath();
      ctx.arc(32, 32, 28 * pulse, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(232, 255, 71, ${0.2 + Math.sin(t * Math.PI * 2) * 0.15})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Spinning arc
      const arcStart = t * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(32, 32, 26, arcStart, arcStart + Math.PI * 1.3);
      ctx.strokeStyle = '#E8FF47';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Second arc (opposite, dimmer)
      ctx.beginPath();
      ctx.arc(32, 32, 26, arcStart + Math.PI, arcStart + Math.PI * 2.0);
      ctx.strokeStyle = 'rgba(232, 255, 71, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Inner glow circle
      const grd = ctx.createRadialGradient(32, 32, 2, 32, 32, 16);
      grd.addColorStop(0, `rgba(232, 255, 71, ${0.5 + Math.sin(t * Math.PI * 2) * 0.3})`);
      grd.addColorStop(1, 'rgba(232, 255, 71, 0)');
      ctx.beginPath();
      ctx.arc(32, 32, 16, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // Lightning bolt ⚡ center
      ctx.fillStyle = '#E8FF47';
      ctx.font = 'bold 22px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚡', 32, 33);

      link.href = canvas.toDataURL('image/png');
      frame = (frame + 1) % 60;
      requestAnimationFrame(draw);
    }

    draw();
  })();
</script>
